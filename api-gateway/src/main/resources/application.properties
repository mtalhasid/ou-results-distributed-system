# ==============================================================================
# 1. CORE GATEWAY SERVER & NETWORK PORTS
# ==============================================================================
spring.application.name=api-gateway
gateway.server-port=${GATEWAY_PORT:8080}
server.port=${gateway.server-port}
gateway.college-map-location=${GATEWAY_COLLEGE_MAP_LOCATION:classpath:shard-map.yml}
spring.codec.max-in-memory-size=50MB

# Backend Microservice URLs
gateway.read-service-url=${READ_SERVICE_URL:lb://result-read-service}
gateway.ingestion-service-url=${INGESTION_SERVICE_URL:http://localhost:3000}
gateway.persistence-service-url=${PERSISTENCE_SERVICE_URL:http://localhost:8085}

# ==============================================================================
# 2. SERVICE DISCOVERY (EUREKA CLIENT)
# ==============================================================================
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=${EUREKA_REGISTER_WITH_EUREKA:true}
eureka.client.fetch-registry=${EUREKA_FETCH_REGISTRY:true}
eureka.client.healthcheck.enabled=true
eureka.client.registry-fetch-interval-seconds=${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS:2}
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:true}
eureka.instance.lease-renewal-interval-in-seconds=${EUREKA_LEASE_RENEWAL_INTERVAL_SECONDS:2}
eureka.instance.lease-expiration-duration-in-seconds=${EUREKA_LEASE_EXPIRATION_DURATION_SECONDS:6}

# ==============================================================================
# 3. REDIS STATE (RATE LIMITING STORE ON PORT 6380)
# ==============================================================================
gateway.redis-host=${REDIS_STATE_HOST:localhost}
gateway.redis-port=${REDIS_STATE_PORT:6380}
spring.data.redis.host=${gateway.redis-host}
spring.data.redis.port=${gateway.redis-port}

gateway.rate-limit.replenish-rate=${GATEWAY_RATE_LIMIT_REPLENISH_RATE:10}
gateway.rate-limit.burst-capacity=${GATEWAY_RATE_LIMIT_BURST_CAPACITY:30}

# ==============================================================================
# 4. RESILIENCE4J CIRCUIT BREAKER SETTINGS
# ==============================================================================
resilience4j.circuitbreaker.configs.default.sliding-window-size=20
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.readService.base-config=default
resilience4j.circuitbreaker.instances.readService.register-health-indicator=true
resilience4j.circuitbreaker.metrics.enabled=true
resilience4j.timelimiter.configs.default.timeout-duration=10s
resilience4j.timelimiter.instances.readService.base-config=default
resilience4j.timelimiter.instances.readService.timeout-duration=10s
spring.cloud.circuitbreaker.bulkhead.resilience4j.enabled=false

# ==============================================================================
# 5. GATEWAY ROUTE DEFINITIONS & ROUTE FILTERS
# ==============================================================================

# ------------------------------------------------------------------------------
# Route [0]: Student Results Read Path (Load-Balanced across Read Instances)
# Path: GET /api/results/**  -->  lb://result-read-service (Port 8082, 8083, ...)
# ------------------------------------------------------------------------------
spring.cloud.gateway.server.webflux.routes[0].id=results
spring.cloud.gateway.server.webflux.routes[0].uri=${gateway.read-service-url}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/results/**
spring.cloud.gateway.server.webflux.routes[0].metadata.response-timeout=10000
spring.cloud.gateway.server.webflux.metrics.enabled=true

# Filter [0]: Token-Bucket Rate Limiter (Checked against Redis State port 6380)
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.key-resolver=#{@clientIpKeyResolver}
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.replenishRate=${gateway.rate-limit.replenish-rate}
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.burstCapacity=${gateway.rate-limit.burst-capacity}

# Filter [1]: Circuit Breaker (Falls back to /fallback/read if backend is dead/slow)
spring.cloud.gateway.server.webflux.routes[0].filters[1].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[0].filters[1].args.name=readService
spring.cloud.gateway.server.webflux.routes[0].filters[1].args.fallbackUri=forward:/fallback/read

# ------------------------------------------------------------------------------
# Route [1]: Exam Publish Status Check (Persistence Service)
# Path: GET /admin/exams/*/publish-status  -->  http://localhost:8085
# ------------------------------------------------------------------------------
spring.cloud.gateway.server.webflux.routes[1].id=admin-publish-status
spring.cloud.gateway.server.webflux.routes[1].uri=${gateway.persistence-service-url}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/admin/exams/*/publish-status

# ------------------------------------------------------------------------------
# Route [2]: Admin Operations & CSV Batch Upload (Ingestion Service)
# Path: POST /admin/**  -->  http://localhost:3000
# ------------------------------------------------------------------------------
spring.cloud.gateway.server.webflux.routes[2].id=admin
spring.cloud.gateway.server.webflux.routes[2].uri=${gateway.ingestion-service-url}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/admin/**

# ==============================================================================
# 6. SECURITY, MANAGEMENT ACTUATOR & LOGGING
# ==============================================================================
gateway.admin-api-key=${ADMIN_API_KEY}

management.endpoints.web.exposure.include=health,info,metrics,gateway,circuitbreakers,circuitbreakerevents
management.endpoint.gateway.access=read-only
management.health.circuitbreakers.enabled=true
management.endpoint.health.show-details=always

logging.level.com.ouresults.gateway=INFO
logging.level.io.github.resilience4j=DEBUG
