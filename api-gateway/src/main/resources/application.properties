spring.application.name=api-gateway
gateway.server-port=${GATEWAY_PORT:8080}
gateway.read-service-url=${READ_SERVICE_URL:http://localhost:8082}
gateway.college-map-location=${GATEWAY_COLLEGE_MAP_LOCATION:classpath:shard-map.yml}
gateway.redis-host=${REDIS_STATE_HOST:localhost}
gateway.redis-port=${REDIS_STATE_PORT:6380}
gateway.rate-limit.replenish-rate=${GATEWAY_RATE_LIMIT_REPLENISH_RATE:10}
gateway.rate-limit.burst-capacity=${GATEWAY_RATE_LIMIT_BURST_CAPACITY:30}

server.port=${gateway.server-port}
spring.data.redis.host=${gateway.redis-host}
spring.data.redis.port=${gateway.redis-port}

spring.cloud.gateway.server.webflux.routes[0].id=results
spring.cloud.gateway.server.webflux.routes[0].uri=${gateway.read-service-url}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/results/**
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.key-resolver=#{@clientIpKeyResolver}
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.replenishRate=${gateway.rate-limit.replenish-rate}
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.burstCapacity=${gateway.rate-limit.burst-capacity}
spring.cloud.gateway.server.webflux.metrics.enabled=true

management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.gateway.access=read-only

logging.level.com.ouresults.gateway=INFO
