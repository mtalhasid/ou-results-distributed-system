spring.application.name=result-read-service
spring.profiles.default=naive
server.port=${SERVER_PORT:8082}
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents,bulkheads,bulkheadevents
management.health.db.enabled=false
management.health.circuitbreakers.enabled=true
management.endpoint.health.show-details=always
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
shard-map-path=${SHARD_MAP_PATH:/app/config/shard-map.yml}
app.expose-instance-id=${APP_EXPOSE_INSTANCE_ID:false}
app.instance-id=${INSTANCE_ID:${spring.application.name}:${server.port}}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=${EUREKA_REGISTER_WITH_EUREKA:true}
eureka.client.fetch-registry=${EUREKA_FETCH_REGISTRY:true}
eureka.client.healthcheck.enabled=true
eureka.client.registry-fetch-interval-seconds=${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS:2}
eureka.instance.instance-id=${app.instance-id}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:true}
eureka.instance.lease-renewal-interval-in-seconds=${EUREKA_LEASE_RENEWAL_INTERVAL_SECONDS:2}
eureka.instance.lease-expiration-duration-in-seconds=${EUREKA_LEASE_EXPIRATION_DURATION_SECONDS:6}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level service=${spring.application.name} correlationId=%X{correlationId} %logger{36} - %msg%n
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=read-service-cache-warmup
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.ouresults.read.dto.PublishedEvent
