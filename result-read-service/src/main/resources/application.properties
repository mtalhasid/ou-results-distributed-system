spring.application.name=result-read-service
spring.profiles.default=naive
server.port=8082
management.endpoints.web.exposure.include=health,info,metrics
management.health.db.enabled=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
shard-map-path=${SHARD_MAP_PATH:/app/config/shard-map.yml}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level service=${spring.application.name} correlationId=%X{correlationId} %logger{36} - %msg%n
