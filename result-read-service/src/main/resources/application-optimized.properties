spring.data.redis.host=${REDIS_CACHE_HOST:localhost}
spring.data.redis.port=${REDIS_CACHE_PORT:6379}
spring.data.redis.connect-timeout=200ms
spring.data.redis.timeout=200ms
spring.data.redis.lettuce.shutdown-timeout=100ms

app.demo.failing-shard=${APP_DEMO_FAILING_SHARD:none}

resilience4j.circuitbreaker.configs.default.sliding-window-size=20
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.metrics.enabled=true
resilience4j.circuitbreaker.instances.shard1Database.base-config=default
resilience4j.circuitbreaker.instances.shard1Database.register-health-indicator=true
resilience4j.circuitbreaker.instances.shard1Database.record-exceptions[0]=com.ouresults.read.exception.DatabaseTechnicalFailureException
resilience4j.circuitbreaker.instances.shard2Database.base-config=default
resilience4j.circuitbreaker.instances.shard2Database.register-health-indicator=true
resilience4j.circuitbreaker.instances.shard2Database.record-exceptions[0]=com.ouresults.read.exception.DatabaseTechnicalFailureException

# Per-shard bulkhead: caps concurrent DB reads independently per shard.
resilience4j.bulkhead.configs.default.max-concurrent-calls=${BULKHEAD_MAX_CONCURRENT_CALLS:25}
resilience4j.bulkhead.configs.default.max-wait-duration=${BULKHEAD_MAX_WAIT_DURATION:0ms}
resilience4j.bulkhead.instances.shard1Database.base-config=default
resilience4j.bulkhead.instances.shard2Database.base-config=default
resilience4j.bulkhead.metrics.enabled=true
