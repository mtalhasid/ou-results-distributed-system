spring.application.name=result-persistence-service
server.port=${SERVER_PORT:8085}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.default-requeue-rejected=false

shard-map-path=${SHARD_MAP_PATH:contracts/shard-map.yml}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.spring.json.add.type.headers=false

app.demo.failing-publish-shard=${APP_DEMO_FAILING_PUBLISH_SHARD:none}
app.demo.crash-after-shards-published=${APP_DEMO_CRASH_AFTER_SHARDS_PUBLISHED:false}
app.demo.failing-kafka-publish=${APP_DEMO_FAILING_KAFKA_PUBLISH:false}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level service=${spring.application.name} correlationId=%X{correlationId} %logger{36} - %msg%n
