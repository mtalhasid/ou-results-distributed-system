services:
  redis-cache:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  redis-state:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    restart: unless-stopped

  result-read-service:
    build:
      context: ./result-read-service
      dockerfile: Dockerfile
    profiles: ["read"]
    environment:
      SHARD_1_PRIMARY: ${SHARD_1_PRIMARY:?Set SHARD_1_PRIMARY in .env}
      SHARD_2_PRIMARY: ${SHARD_2_PRIMARY:?Set SHARD_2_PRIMARY in .env}
      SHARD_MAP_PATH: /app/config/shard-map.yml
    ports:
      - "8082:8082"
    volumes:
      - ./contracts/shard-map.yml:/app/config/shard-map.yml:ro
    mem_limit: 768m
    restart: unless-stopped
