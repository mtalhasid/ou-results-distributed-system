spring.application.name=service-discovery
server.port=${EUREKA_PORT:8761}

eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.server.enable-self-preservation=${EUREKA_ENABLE_SELF_PRESERVATION:false}
eureka.server.eviction-interval-timer-in-ms=${EUREKA_EVICTION_INTERVAL_MS:1000}
eureka.server.response-cache-update-interval-ms=${EUREKA_RESPONSE_CACHE_UPDATE_INTERVAL_MS:1000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
